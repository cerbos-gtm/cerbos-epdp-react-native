name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  EXPO_NO_TELEMETRY: "1"
  CI: "1"

jobs:
  checks:
    name: Typecheck, lint, test, bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint -- --max-warnings=0

      - name: Test
        run: npm run test:ci

      # Bundles the native app and the ePDP DOM component (including the
      # WebAssembly engine asset) the same way a release build does.
      - name: Export iOS bundle
        run: npx expo export --platform ios --output-dir /tmp/export-ios

      - name: Export Android bundle
        run: npx expo export --platform android --output-dir /tmp/export-android
